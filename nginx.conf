server {
    listen 80;
    server_name _;                  # any hostname

    root /usr/share/nginx/html;     # where you copied /app/dist

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
